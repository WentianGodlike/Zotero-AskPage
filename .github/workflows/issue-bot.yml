name: Issue Bot

on:
  issues:
    types:
      - labeled
  issue_comment:
    types:
      - created
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  issue-bot:
    # Pinned to a commit SHA: @main would let any upstream push change how
    # issues are answered here. Update deliberately, after reading the diff.
    uses: zotero-plugin-dev/workflows/.github/workflows/issue-bot.yml@6bc4563f443313f6cebd3e425ba02f8929fb8d3f
